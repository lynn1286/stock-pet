name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            id: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos-latest
            id: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundle_root: src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: windows-latest
            id: x86_64-pc-windows-msvc
            args: ''
            bundle_root: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare signing and build args
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUILD_ARGS="${{ matrix.args }}"
          if [ -z "${SIGNING_KEY}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY 未配置，跳过 updater 签名产物"
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.ci.json
            BUILD_ARGS="${BUILD_ARGS} --config src-tauri/tauri.ci.json"
          else
            KEY_FILE="${RUNNER_TEMP}/tauri-signing.key"
            printf '%s' "${SIGNING_KEY}" > "${KEY_FILE}"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=${KEY_FILE}" >> "${GITHUB_ENV}"
            # 当前密钥生成时未设密码，固定为空，避免误配 Secret 导致验签失败
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "${GITHUB_ENV}"
          fi
          echo "BUILD_ARGS=${BUILD_ARGS}" >> "${GITHUB_ENV}"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ env.BUILD_ARGS }}
          tauriScript: pnpm tauri

      - name: Normalize updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            MACOS_DIR="${{ matrix.bundle_root }}/macos"
            if [ ! -d "$MACOS_DIR" ]; then
              echo "No macOS bundle directory"
              exit 0
            fi
            cd "$MACOS_DIR"
            archive="$(find . -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
            if [ -z "$archive" ]; then
              echo "No updater archive found"
              exit 0
            fi
            archive="${archive#./}"
            target="${{ matrix.id }}-update.app.tar.gz"
            mv "$archive" "$target"
            if [ -f "${archive}.sig" ]; then
              mv "${archive}.sig" "${target}.sig"
            fi
            ls -la
          else
            NSIS_DIR="${{ matrix.bundle_root }}/nsis"
            if [ ! -d "$NSIS_DIR" ]; then
              echo "No NSIS bundle directory"
              exit 0
            fi
            cd "$NSIS_DIR"
            installer="$(find . -maxdepth 1 -name '*-setup.exe' -print -quit)"
            if [ -z "$installer" ]; then
              echo "No Windows installer found"
              exit 0
            fi
            installer="${installer#./}"
            target="windows-x86_64-setup.exe"
            mv "$installer" "$target"
            if [ -f "${installer}.sig" ]; then
              mv "${installer}.sig" "${target}.sig"
            fi
            ls -la
          fi

      - name: Verify updater signatures
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}" ]; then
            echo "Signing disabled, skip updater verification"
            exit 0
          fi
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            test -f "${{ matrix.bundle_root }}/macos/${{ matrix.id }}-update.app.tar.gz"
            test -f "${{ matrix.bundle_root }}/macos/${{ matrix.id }}-update.app.tar.gz.sig"
          else
            test -f "${{ matrix.bundle_root }}/nsis/windows-x86_64-setup.exe"
            test -f "${{ matrix.bundle_root }}/nsis/windows-x86_64-setup.exe.sig"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_root }}/dmg/*.dmg
            ${{ matrix.bundle_root }}/macos/*.app.tar.gz
            ${{ matrix.bundle_root }}/macos/*.app.tar.gz.sig
            ${{ matrix.bundle_root }}/nsis/*.exe
            ${{ matrix.bundle_root }}/nsis/*.exe.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: release-*
          merge-multiple: true

      - name: Generate latest.json
        run: |
          python3 .github/scripts/generate-latest-json.py
          test -f bundles/latest.json
          cat bundles/latest.json

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 会盯盘的桌宠 v${{ steps.version.outputs.version }}
          body: 会盯盘的桌宠 v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: bundles/**/*
          fail_on_unmatched_files: true
