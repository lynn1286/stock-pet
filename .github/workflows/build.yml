name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            id: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos-latest
            id: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundle_root: src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: windows-latest
            id: x86_64-pc-windows-msvc
            args: ''
            bundle_root: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build config
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY 未配置，跳过 updater 签名产物"
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.ci.json
            echo "BUILD_ARGS=${{ matrix.args }} --config src-tauri/tauri.ci.json" >> "$GITHUB_ENV"
          else
            echo "BUILD_ARGS=${{ matrix.args }}" >> "$GITHUB_ENV"
          fi

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          args: ${{ env.BUILD_ARGS }}
          tauriScript: pnpm tauri

      - name: Rename macOS updater bundles
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          MACOS_DIR="${{ matrix.bundle_root }}/macos"
          if [ ! -d "$MACOS_DIR" ]; then
            exit 0
          fi
          cd "$MACOS_DIR"
          for archive in *.app.tar.gz; do
            [ -f "$archive" ] || continue
            prefix="${{ matrix.id }}-${archive}"
            mv "$archive" "$prefix"
            if [ -f "${archive}.sig" ]; then
              mv "${archive}.sig" "${prefix}.sig"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: |
            ${{ matrix.bundle_root }}/dmg/*.dmg
            ${{ matrix.bundle_root }}/macos/*
            ${{ matrix.bundle_root }}/nsis/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: release-*
          merge-multiple: true

      - name: Generate latest.json
        run: python3 .github/scripts/generate-latest-json.py

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 会盯盘的桌宠 v${{ steps.version.outputs.version }}
          body: 会盯盘的桌宠 v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: bundles/**/*
          fail_on_unmatched_files: true
